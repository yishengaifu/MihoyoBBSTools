```yaml
name: AutoMihoyoBBS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Run sign script
      env:
        COOKIE: ${{ secrets.COOKIE }}
      run: python main.py
```
